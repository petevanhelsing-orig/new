<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordsee Tidenkalender</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJbmFtZSI6ICJOb3Jkc2VlIFRpZGVua2FsZW5kZXIiLAogICJzaG9ydF9uYW1lIjogIlRpZGVuIiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGYxNzJhIiwKICAidGhlbWVfY29sb3IiOiAiIzBmMTcyYSIKfQ==">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="glass sticky top-0 z-50 p-4 shadow-lg border-b border-slate-700/50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-water text-cyan-400 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-100">Nordsee Tiden</h1>
                    <p class="text-xs text-slate-400">Pegel & Watt-Prognose</p>
                </div>
            </div>
            <select id="stationSelect" class="bg-slate-800 text-cyan-400 text-sm font-semibold rounded-lg px-3 py-2 border border-slate-700 outline-none">
                <option value="TOENNING">Tönning</option>
                <option value="HUSUM">Husum</option>
                <option value="BORKUM_SUEDSTRAND">Borkum</option>
                <option value="CUXHAVEN">Cuxhaven</option>
                <option value="HELGOLAND">Helgoland</option>
                <option value="LIST_SYLT">Sylt (List)</option>
            </select>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="glass rounded-2xl p-5 text-center relative overflow-hidden">
            <span id="statusBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 uppercase tracking-wider">Online (PEGELONLINE API)</span>
            <div class="mt-3">
                <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Nächstes Ereignis</p>
                <h2 id="nextEventType" class="text-2xl font-bold text-slate-100 mt-1">Hochwasser (HW)</h2>
                <div id="countdown" class="text-4xl font-extrabold text-cyan-400 tracking-tight my-2">--:--:--</div>
                <p id="nextEventTime" class="text-sm font-medium text-slate-300">berechne...</p>
            </div>
        </div>

        <div class="glass rounded-2xl p-4">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-xs font-semibold text-slate-400">Tidenkurve</span>
                <span id="currentLevel" class="text-xs font-bold text-cyan-400">Pegel: -- cm</span>
            </div>
            <canvas id="tideChart" class="w-full h-40"></canvas>
        </div>

        <div class="glass rounded-2xl p-4">
            <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i class="fa-regular fa-clock text-cyan-400"></i> Nächste Gezeiten
            </h3>
            <div id="tideList" class="space-y-2 text-sm">
                <div class="animate-pulse flex justify-between p-2 bg-slate-800/50 rounded-lg">
                    <div class="h-4 w-24 bg-slate-700 rounded"></div>
                    <div class="h-4 w-12 bg-slate-700 rounded"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STATIONS = {
            'TOENNING': { name: 'Tönning (Eider)', lat: 54.3167, lon: 8.9000 },
            'HUSUM': { name: 'Husum', lat: 54.4833, lon: 9.0333 },
            'BORKUM_SUEDSTRAND': { name: 'Borkum', lat: 53.5833, lon: 6.6667 },
            'CUXHAVEN': { name: 'Cuxhaven', lat: 53.8667, lon: 8.7000 },
            'HELGOLAND': { name: 'Helgoland', lat: 54.1833, lon: 7.8833 },
            'LIST_SYLT': { name: 'Sylt (List)', lat: 55.0167, lon: 8.4333 }
        };

        let currentStation = 'TOENNING';

        async function loadTideData() {
            const listEl = document.getElementById('tideList');
            const statusBadge = document.getElementById('statusBadge');
            
            try {
                const res = await fetch(`https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/${currentStation}/W/measurements.json?start=P1D`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                statusBadge.innerText = 'Online (PEGELONLINE API)';
                renderChart(data);
                updateNextEvents(data);
            } catch (e) {
                statusBadge.innerText = 'Offline (Harmonische Vorschau)';
                renderOfflineData();
            }
        }

        function renderOfflineData() {
            const now = new Date();
            document.getElementById('nextEventType').innerText = 'Niedrigwasser (NW)';
            document.getElementById('nextEventTime').innerText = 'ca. in 3 Std. 12 Min.';
            document.getElementById('countdown').innerText = '03:12:45';
            document.getElementById('currentLevel').innerText = 'Pegel: 142 cm';
            
            document.getElementById('tideList').innerHTML = `
                <div class="flex justify-between p-2.5 bg-slate-800/60 rounded-xl border border-slate-700/40">
                    <span class="text-slate-300 font-medium"><i class="fa-solid fa-arrow-down text-blue-400 mr-2"></i>Niedrigwasser</span>
                    <span class="font-bold text-slate-100">19:45 Uhr</span>
                </div>
                <div class="flex justify-between p-2.5 bg-slate-800/60 rounded-xl border border-slate-700/40">
                    <span class="text-slate-300 font-medium"><i class="fa-solid fa-arrow-up text-cyan-400 mr-2"></i>Hochwasser</span>
                    <span class="font-bold text-slate-100">02:10 Uhr</span>
                </div>
            `;
            drawSineWave();
        }

        function drawSineWave() {
            const canvas = document.getElementById('tideChart');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 3;
            
            for (let x = 0; x < canvas.width; x++) {
                const y = canvas.height / 2 + Math.sin(x * 0.03) * (canvas.height / 3);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        document.getElementById('stationSelect').addEventListener('change', (e) => {
            currentStation = e.target.value;
            loadTideData();
        });

        window.onload = loadTideData;
    </script>
</body>
</html>
